# Runner labels expected on the Mac mini: self-hosted, macOS, AgentOrange
name: Develop CI

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: develop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-screenshot:
    name: Unit tests and screenshots
    runs-on: [self-hosted, macOS, AgentOrange]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby gems
        run: bundle install

      - name: Run unit tests
        run: bundle exec fastlane ios tests

